name: CI

on:
  push:
    branches:
      - main
      - develop
      - radames/proposal-status
  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: freelaconnect-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: freelaconnect-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: freelaconnect-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: freelaconnect
          POSTGRES_PASSWORD: freelaconnect
          POSTGRES_DB: freelaconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freelaconnect -d freelaconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: freelaconnect
      DB_PASSWORD: freelaconnect
      DB_DATABASE: freelaconnect_test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: freelaconnect
      TEST_DB_PASSWORD: freelaconnect
      TEST_DB_DATABASE: freelaconnect_test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: freelaconnect-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm config set dangerouslyAllowAllBuilds true
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        run: pnpm run test

      - name: Test integration
        run: pnpm run test:integration

      - name: Test e2e
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Build application images
        run: docker compose build frontend backend
