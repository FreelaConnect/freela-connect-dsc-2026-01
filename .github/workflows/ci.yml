name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: freelaconnect-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: freelaconnect-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: freelaconnect-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: freelaconnect
          POSTGRES_PASSWORD: freelaconnect
          POSTGRES_DB: freelaconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freelaconnect -d freelaconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3002
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: freelaconnect
      DB_PASSWORD: freelaconnect
      DB_DATABASE: freelaconnect_test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: freelaconnect
      TEST_DB_PASSWORD: freelaconnect
      TEST_DB_DATABASE: freelaconnect_test
      JWT_SECRET: ci-test-secret
      TYPEORM_SYNCHRONIZE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: freelaconnect-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm config set dangerouslyAllowAllBuilds true
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Unit tests
        run: pnpm run test

      - name: Integration tests
        run: pnpm run test:integration

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

  docker:
    name: Docker image validation and publish
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    env:
      DB_USERNAME: freelaconnect
      DB_PASSWORD: freelaconnect
      DB_DATABASE: freelaconnect
      JWT_SECRET: ci-compose-secret
      BACKEND_IMAGE: freelaconnect-backend:ci
      FRONTEND_IMAGE: freelaconnect-frontend:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: images
        shell: bash
        run: |
          repository="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          ref_tag="$(echo '${{ github.ref_name }}' | tr '/:@ ' '----' | tr -cd 'A-Za-z0-9_.-')"
          backend_image="${REGISTRY}/${repository}-backend"
          frontend_image="${REGISTRY}/${repository}-frontend"

          {
            echo "backend_image=${backend_image}"
            echo "frontend_image=${frontend_image}"
            echo "backend_tags<<EOF"
            echo "${backend_image}:latest"
            echo "${backend_image}:${{ github.sha }}"
            echo "${backend_image}:${ref_tag}"
            echo "EOF"
            echo "frontend_tags<<EOF"
            echo "${frontend_image}:latest"
            echo "${frontend_image}:${{ github.sha }}"
            echo "${frontend_image}:${ref_tag}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate production Compose file
        run: docker compose -f docker-compose.prod.yml config

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and optionally publish backend production image
        uses: docker/build-push-action@v6
        with:
          context: freelaconnect-backend
          file: freelaconnect-backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.backend_tags }}

      - name: Build and optionally publish frontend production image
        uses: docker/build-push-action@v6
        with:
          context: freelaconnect-frontend
          file: freelaconnect-frontend/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3002' }}
          tags: ${{ steps.images.outputs.frontend_tags }}
