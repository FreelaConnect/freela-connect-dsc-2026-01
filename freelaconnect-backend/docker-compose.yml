version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: freelaconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: freelaconnect
      POSTGRES_PASSWORD: freelaconnect
      POSTGRES_DB: freelaconnect
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelaconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freelaconnect-network

  # Backend Application (optional - for production-like testing)
  # Uncomment to use with docker-compose
  # backend:
  #   build:
  #     context: ./freelaconnect-backend
  #     dockerfile: ../Dockerfile
  #   container_name: freelaconnect-backend
  #   restart: unless-stopped
  #   ports:
  #     - "3002:3000"
  #   environment:
  #     NODE_ENV: production
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USERNAME: freelaconnect
  #     DB_PASSWORD: freelaconnect
  #     DB_DATABASE: freelaconnect
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - freelaconnect-network

volumes:
  postgres-data:

networks:
  freelaconnect-network:
    driver: bridge